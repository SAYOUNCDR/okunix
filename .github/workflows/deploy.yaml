name: Deploy Okunix MERN Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build Frontend
        working-directory: ./client
        run: |
          npm install
          echo "VITE_API_URL=https://okunix-api.sayoun.studio" > .env
          npm run build

      - name: Prepare Backend
        working-directory: ./server
        run: npm install --omit=dev

      - name: Create Package
        run: |
          mkdir -p deploy
          cp -r server deploy/
          cp -r client/dist deploy/client-dist
          cp ecosystem.config.js deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okunix-bundle
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Ship to Azure VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: okunix-bundle

      - name: Upload Bundle to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/" # Uploads to /home/azureuser/deploy.tar.gz

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/projects/okunix
            mv ~/deploy.tar.gz ~/projects/okunix/deploy.tar.gz
            cd ~/projects/okunix

            # 1. Backup the current working version
            [ -d "server" ] && tar -czf backup_$(date +%Y%m%d_%H%M%S).tar.gz server client-dist 2>/dev/null || true
            
            # --- THE MISSING LINE GOES HERE ---
            # 2. Rotate backups: keep only the 5 most recent ones
            ls -t backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            
            # 3. CLEANUP: Clear old folders for a fresh extraction
            rm -rf server client-dist ecosystem.config.js
            
            # 4. Extract the new bundle
            tar -xzf deploy.tar.gz -C .
            
            # 5. Inject Backend Secrets
            echo "${{ secrets.SERVER_ENV }}" > server/.env

            # 6. Reload PM2
            pm2 startOrReload ecosystem.config.js
            pm2 save

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/projects/okunix
            echo "Deployment failed! Rolling back..."
            LATEST_BACKUP=$(ls -t backup_*.tar.gz 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              tar -xzf "$LATEST_BACKUP" -C .
              pm2 startOrReload ecosystem.config.js
              echo "✅ Successfully rolled back to $LATEST_BACKUP"
            else
              echo "❌ No backup found to roll back to!"
              exit 1
            fi