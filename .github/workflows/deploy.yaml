name: Deploy Okunix MERN Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 1. Build Frontend (Variables are baked in here)
      - name: Build Frontend
        working-directory: ./client
        run: |
          npm install
          # Vite MUST have this file during 'npm run build'
          echo "VITE_API_URL=https://okunix-api.sayoun.studio" > .env
          npm run build

      # 2. Prepare Backend
      - name: Prepare Backend
        working-directory: ./server
        run: npm install --omit=dev

      # 3. Create bundle (Using PM2_CONF secret instead of a file)
      - name: Create Package
        run: |
          mkdir -p deploy
          cp -r server deploy/
          cp -r client/dist deploy/client-dist
          # Create the ecosystem file from your GitHub Secret
          echo "${{ secrets.PM2_CONF }}" > deploy/ecosystem.config.js
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okunix-bundle
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Ship to Azure VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: okunix-bundle

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/projects/okunix
            cd ~/projects/okunix

            # Backup current state
            [ -d "server" ] && tar -czf backup_$(date +%F).tar.gz server client-dist 2>/dev/null || true
            
            # Extract new bundle (includes the secret ecosystem file)
            tar -xzf ~/deploy.tar.gz -C .
            
            # Inject Backend Env Secrets
            echo "${{ secrets.SERVER_ENV }}" > server/.env

            # Reload Apps using the new config
            pm2 startOrReload ecosystem.config.js
            pm2 save